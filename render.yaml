services:
  - type: web
    name: kayjob-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: kayjob-private
      - key: SENE_PAY_BASE_URL
        value: https://api.sene-pay.com
      - key: SENE_PAY_PUBLIC_KEY
        sync: false
      - key: SENE_PAY_SECRET_KEY
        sync: false
      - key: SENE_PAY_WEBHOOK_SECRET
        sync: false

  - type: cron
    name: kayjob-release-expired
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: npm run api:release-expired
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
